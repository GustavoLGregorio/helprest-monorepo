// ============ UML TOGGLE ============
function toggleUML() {
  umlMode = !umlMode;
  document.body.className = umlMode ? 'light' : 'dark';
  document.getElementById('umlToggle').classList.toggle('active', umlMode);
  const al = document.getElementById('assocLine');

  const el = document.getElementById('extLine');

  render();
}

// ============ RESIZE ============
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  render();
}
window.addEventListener('resize', resize);

// ============ TRANSFORMS ============
function toWorld(sx, sy) { return { x: (sx - offsetX) / scale, y: (sy - offsetY) / scale }; }

// ============ HELPERS ============
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function ellipseEdge(cx, cy, fx, fy) {
  const a = Math.atan2(fy - cy, fx - cx);
  return { x: cx + RX * Math.cos(a), y: cy + RY * Math.sin(a) };
}

// ============ SMART LINE ROUTING ============
// Check if a line segment passes through any ellipse (excluding source/target)
function segmentHitsEllipse(x1,y1,x2,y2,uc) {
  // Sample points along the line and check if inside ellipse
  const steps = 8;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const px = x1 + (x2-x1)*t, py = y1 + (y2-y1)*t;
    const dx = (px-uc.x)/(RX+8), dy = (py-uc.y)/(RY+6);
    if (dx*dx + dy*dy < 1) return true;
  }
  return false;
}

function getBlockingUCs(x1, y1, x2, y2, excludeIds) {
  return useCases.filter(uc => !excludeIds.includes(uc.id) && segmentHitsEllipse(x1,y1,x2,y2,uc));
}

// Compute a control point that curves around blocking elements
function computeControlPoint(x1, y1, x2, y2, excludeIds, actorId) {
  const blockers = getBlockingUCs(x1, y1, x2, y2, excludeIds);
  if (blockers.length === 0) return null;

  // Find the most blocking UC (closest to midpoint)
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  let worst = blockers[0], worstDist = Infinity;
  for (const b of blockers) {
    const d = Math.hypot(b.x-mx, b.y-my);
    if (d < worstDist) { worstDist = d; worst = b; }
  }

  // Determine offset direction perpendicular to line
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy) || 1;
  let nx = -dy/len, ny = dx/len;

  // Pick offset side: bias based on actor vertical position relative to target
  // This spreads lines from same actor to different vertical offsets
  const assocIndex = associations.filter(a => a.actor === actorId).findIndex(a => a.uc === excludeIds[excludeIds.length-1]);
  if (assocIndex % 2 === 0) { nx = -nx; ny = -ny; }

  const offset = RY * 2.5 + (blockers.length * 8);
  return { x: mx + nx * offset, y: my + ny * offset };
}

// ============ DRAWING: STICK FIGURE ============
function drawStick(x, y, label, highlight) {
  let c;
  if (umlMode) {
    c = '#1a1a1a';
  } else {
    c = highlight ? '#58a6ff' : '#c9d1d9';
  }
  ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y-28, 11, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y-17); ctx.lineTo(x, y+12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-16, y-4); ctx.lineTo(x+16, y-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y+12); ctx.lineTo(x-13, y+35);
  ctx.moveTo(x, y+12); ctx.lineTo(x+13, y+35); ctx.stroke();
  ctx.font = '600 12px Inter,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  label.split('\n').forEach((l, i) => ctx.fillText(l, x, y + 42 + i * 14));
}

// ============ DRAWING: ELLIPSE ============
function drawUCEllipse(uc, highlight) {
  const pkg = packages.find(p => p.id === uc.pkg);
  const col = pkg ? pkg.color : '#888';

  ctx.beginPath(); ctx.ellipse(uc.x, uc.y, RX, RY, 0, 0, Math.PI*2);
  if (umlMode) {
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
  } else {
    const alpha = highlight ? 0.55 : 0.2;
    ctx.fillStyle = hexAlpha(col, alpha); ctx.fill();
    ctx.strokeStyle = highlight ? col : hexAlpha(col, 0.6);
    ctx.lineWidth = highlight ? 2.5 : 1.2; ctx.stroke();
    ctx.fillStyle = highlight ? '#fff' : '#c9d1d9';
  }
  ctx.font = '11px Inter,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(uc.label, uc.x, uc.y);
}

// ============ DRAWING: PACKAGE ============
function drawPkg(pkg) {
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(pkg.x+r, pkg.y); ctx.lineTo(pkg.x+pkg.w-r, pkg.y);
  ctx.quadraticCurveTo(pkg.x+pkg.w, pkg.y, pkg.x+pkg.w, pkg.y+r);
  ctx.lineTo(pkg.x+pkg.w, pkg.y+pkg.h-r);
  ctx.quadraticCurveTo(pkg.x+pkg.w, pkg.y+pkg.h, pkg.x+pkg.w-r, pkg.y+pkg.h);
  ctx.lineTo(pkg.x+r, pkg.y+pkg.h);
  ctx.quadraticCurveTo(pkg.x, pkg.y+pkg.h, pkg.x, pkg.y+pkg.h-r);
  ctx.lineTo(pkg.x, pkg.y+r);
  ctx.quadraticCurveTo(pkg.x, pkg.y, pkg.x+r, pkg.y);
  ctx.closePath();

  if (umlMode) {
    ctx.fillStyle = 'rgba(245,245,245,0.5)';
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = '600 11px Inter,sans-serif';
    ctx.fillStyle = '#555';
  } else {
    ctx.strokeStyle = hexAlpha(pkg.color, 0.35); ctx.lineWidth = 1.5;
    ctx.fillStyle = hexAlpha(pkg.color, 0.04);
    ctx.fill(); ctx.stroke();
    ctx.font = '600 11px Inter,sans-serif';
    ctx.fillStyle = hexAlpha(pkg.color, 0.7);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(pkg.label, pkg.x + 8, pkg.y + 5);
}

// ============ DRAWING: ASSOCIATION LINES ============
function drawAssocLine(ax, ay, uc, highlight, actorId) {
  const edge = ellipseEdge(uc.x, uc.y, ax, ay);

  if (umlMode) {
    // Smart routing: check for blocking UCs
    const cp = computeControlPoint(ax, ay, edge.x, edge.y, [uc.id], actorId);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(30,30,30,0.55)';
    ctx.lineWidth = 1;
    if (cp) {
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(cp.x, cp.y, edge.x, edge.y);
    } else {
      ctx.moveTo(ax, ay);
      ctx.lineTo(edge.x, edge.y);
    }
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(edge.x, edge.y);
    ctx.strokeStyle = highlight ? 'rgba(200,220,255,0.65)' : 'rgba(200,220,255,0.06)';
    ctx.lineWidth = highlight ? 1.8 : 0.7;
    ctx.stroke();
  }
}

// ============ DRAWING: RELATIONSHIP LINES ============
function drawRelLine(from, to, type, highlight) {
  const e1 = ellipseEdge(from.x, from.y, to.x, to.y);
  const e2 = ellipseEdge(to.x, to.y, from.x, from.y);

  let col, lineAlpha, arrowAlpha, labelColor;
  if (umlMode) {
    col = type === 'include' ? '#333' : '#555';
    lineAlpha = 1; arrowAlpha = 1; labelColor = '#333';
  } else {
    col = type === 'include' ? '#58a6ff' : '#f0883e';
    lineAlpha = highlight ? 1 : 0.25;
    arrowAlpha = highlight ? 1 : 0.3;
    labelColor = highlight ? col : hexAlpha(col, 0.5);
  }

  // Smart routing for relationship lines too
  const cp = umlMode ? computeControlPoint(e1.x, e1.y, e2.x, e2.y, [from.id || '', to.id || ''], '') : null;

  ctx.beginPath();
  ctx.setLineDash([6, 4]);
  if (cp) {
    ctx.moveTo(e1.x, e1.y);
    ctx.quadraticCurveTo(cp.x, cp.y, e2.x, e2.y);
  } else {
    ctx.moveTo(e1.x, e1.y);
    ctx.lineTo(e2.x, e2.y);
  }
  ctx.strokeStyle = umlMode ? col : (highlight ? col : hexAlpha(col, lineAlpha));
  ctx.lineWidth = umlMode ? 1.5 : (highlight ? 2 : 1);
  ctx.stroke();
  ctx.setLineDash([]);

  // Arrow at e2
  const endX = e2.x, endY = e2.y;
  let angle;
  if (cp) {
    angle = Math.atan2(endY - cp.y, endX - cp.x);
  } else {
    angle = Math.atan2(e2.y - e1.y, e2.x - e1.x);
  }
  ctx.beginPath();
  ctx.moveTo(endX, endY);
  ctx.lineTo(endX - 10*Math.cos(angle-0.35), endY - 10*Math.sin(angle-0.35));
  ctx.lineTo(endX - 10*Math.cos(angle+0.35), endY - 10*Math.sin(angle+0.35));
  ctx.closePath();
  ctx.fillStyle = umlMode ? col : hexAlpha(col, arrowAlpha);
  ctx.fill();

  // Label
  let mx, my;
  if (cp) {
    // Midpoint of quadratic bezier at t=0.5
    mx = 0.25*e1.x + 0.5*cp.x + 0.25*e2.x;
    my = 0.25*e1.y + 0.5*cp.y + 0.25*e2.y - 10;
  } else {
    mx = (e1.x+e2.x)/2;
    my = (e1.y+e2.y)/2 - 8;
  }
  ctx.font = '600 9px Inter,sans-serif';
  ctx.fillStyle = umlMode ? labelColor : (highlight ? col : hexAlpha(col, 0.5));
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(type === 'include' ? '«include»' : '«extend»', mx, my);
}

// ============ DRAWING: INHERITANCE ============
function drawInheritance(child, parent) {
  const lineCol = umlMode ? '#1a1a1a' : 'rgba(200,220,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(child.x, child.y - 28);
  ctx.lineTo(parent.x, parent.y + 40);
  ctx.strokeStyle = lineCol; ctx.lineWidth = 1.5; ctx.stroke();
  const a = Math.atan2(parent.y+40 - (child.y-28), parent.x - child.x);
  const tx = parent.x, ty = parent.y + 40;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - 12*Math.cos(a-0.4), ty - 12*Math.sin(a-0.4));
  ctx.lineTo(tx - 12*Math.cos(a+0.4), ty - 12*Math.sin(a+0.4));
  ctx.closePath();
  ctx.fillStyle = umlMode ? '#fff' : '#0d1117';
  ctx.fill();
  ctx.strokeStyle = lineCol;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ============ HIT TEST ============
function hitTest(wx, wy) {
  for (const a of actors) {
    if (Math.abs(wx-a.x)<25 && wy > a.y-45 && wy < a.y+65) return {type:'actor',id:a.id};
  }
  for (const u of useCases) {
    const dx = (wx-u.x)/RX, dy = (wy-u.y)/RY;
    if (dx*dx+dy*dy <= 1) return {type:'uc',id:u.id};
  }
  return null;
}
function isHighlighted(type, id) {
  if (!hoveredActor && !hoveredUC) return false;
  if (hoveredActor) {
    if (type==='actor' && id===hoveredActor) return true;
    if (type==='uc') return associations.some(a=>a.actor===hoveredActor && a.uc===id);
  }
  if (hoveredUC) {
    if (type==='uc' && id===hoveredUC) return true;
    if (type==='actor') return associations.some(a=>a.actor===id && a.uc===hoveredUC);
    if (type==='uc') return relationships.some(r=>(r.from===hoveredUC&&r.to===id)||(r.to===hoveredUC&&r.from===id));
  }
  return false;
}

// ============ RENDER ============
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Background fill for UML mode
  if (umlMode) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // System boundary
  const sb = systemBoundary, br = 12;
  ctx.beginPath();
  ctx.moveTo(sb.x+br,sb.y); ctx.lineTo(sb.x+sb.w-br,sb.y);
  ctx.quadraticCurveTo(sb.x+sb.w,sb.y,sb.x+sb.w,sb.y+br);
  ctx.lineTo(sb.x+sb.w,sb.y+sb.h-br);
  ctx.quadraticCurveTo(sb.x+sb.w,sb.y+sb.h,sb.x+sb.w-br,sb.y+sb.h);
  ctx.lineTo(sb.x+br,sb.y+sb.h);
  ctx.quadraticCurveTo(sb.x,sb.y+sb.h,sb.x,sb.y+sb.h-br);
  ctx.lineTo(sb.x,sb.y+br);
  ctx.quadraticCurveTo(sb.x,sb.y,sb.x+br,sb.y);
  ctx.closePath();
  if (umlMode) {
    ctx.fillStyle = '#fafafa'; ctx.fill();
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(22,27,34,0.6)'; ctx.fill();
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.font = '700 16px Inter,sans-serif';
  ctx.fillStyle = umlMode ? '#1a1a1a' : '#58a6ff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(sb.label, sb.x + sb.w/2, sb.y + 6);

  // Packages
  packages.forEach(drawPkg);

  // Association lines
  const hasHover = hoveredActor || hoveredUC;
  if (umlMode) {
    // In UML mode: always show all lines
    associations.forEach(({actor, uc}) => {
      const a = actorMap[actor], u = ucMap[uc]; if(!a||!u) return;
      drawAssocLine(a.x, a.y, u, true, actor);
    });
  } else {
    associations.forEach(({actor, uc}) => {
      const a = actorMap[actor], u = ucMap[uc]; if(!a||!u) return;
      const hl = hasHover && (hoveredActor===actor || hoveredUC===uc);
      drawAssocLine(a.x, a.y, u, hl, actor);
    });
  }

  // Relationship lines
  if (umlMode) {
    relationships.forEach(({from, to, type}) => {
      const f = ucMap[from], t = ucMap[to]; if(!f||!t) return;
      drawRelLine(f, t, type, true);
    });
  } else {
    relationships.forEach(({from, to, type}) => {
      const f = ucMap[from], t = ucMap[to]; if(!f||!t) return;
      const hl = hasHover && (hoveredUC===from || hoveredUC===to);
      drawRelLine(f, t, type, !hasHover || hl);
    });
  }

  // Inheritance
  inheritance.forEach(({child, parent}) => drawInheritance(actorMap[child], actorMap[parent]));

  // Ellipses (drawn ON TOP of lines)
  if (umlMode) {
    useCases.forEach(uc => drawUCEllipse(uc, true));
  } else {
    useCases.forEach(uc => drawUCEllipse(uc, !hasHover || isHighlighted('uc', uc.id)));
  }

  // Actors
  if (umlMode) {
    actors.forEach(a => drawStick(a.x, a.y, a.label, true));
  } else {
    actors.forEach(a => drawStick(a.x, a.y, a.label, !hasHover || isHighlighted('actor', a.id)));
  }

  ctx.restore();
}

// ============ EVENTS ============
canvas.addEventListener('mousedown', e => { dragging=true; dragStartX=e.clientX-offsetX; dragStartY=e.clientY-offsetY; canvas.classList.add('grabbing'); });
canvas.addEventListener('mousemove', e => {
  if (dragging) { offsetX=e.clientX-dragStartX; offsetY=e.clientY-dragStartY; render(); return; }
  const w = toWorld(e.clientX, e.clientY);
  const hit = hitTest(w.x, w.y);
  const prev = hoveredActor || hoveredUC;
  hoveredActor = null; hoveredUC = null;
  if (hit) { if(hit.type==='actor') hoveredActor=hit.id; else hoveredUC=hit.id; }
  if ((hoveredActor||hoveredUC) !== prev) render();
  const tt = document.getElementById('tooltip');
  if (hit) {
    let html = '';
    if (hit.type === 'uc') {
      const u = ucMap[hit.id];
      const conns = associations.filter(a=>a.uc===hit.id).map(a=>actorMap[a.actor].label);
      const rels = relationships.filter(r=>r.from===hit.id||r.to===hit.id);
      html = `<strong>${hit.id}: ${u.label}</strong><br>Pacote: ${packages.find(p=>p.id===u.pkg).label}<br>Atores: ${conns.join(', ')||'—'}`;
      if (rels.length) html += '<br>Relações: ' + rels.map(r=>`${r.type}(${r.from===hit.id?r.to:r.from})`).join(', ');
    } else {
      const a = actorMap[hit.id];
      const ucs = associations.filter(as=>as.actor===hit.id).length;
      html = `<strong>${a.label}</strong><br>${ucs} casos de uso`;
    }
    tt.innerHTML = html; tt.style.display = 'block';
    tt.style.left = (e.clientX+16)+'px'; tt.style.top = (e.clientY+16)+'px';
  } else { tt.style.display = 'none'; }
});
canvas.addEventListener('mouseup', () => { dragging=false; canvas.classList.remove('grabbing'); });
canvas.addEventListener('mouseleave', () => { dragging=false; hoveredActor=null; hoveredUC=null; canvas.classList.remove('grabbing'); render(); document.getElementById('tooltip').style.display='none'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const z = e.deltaY < 0 ? 1.1 : 0.9;
  const wx = (e.clientX - offsetX) / scale;
  const wy = (e.clientY - offsetY) / scale;
  scale = Math.max(0.15, Math.min(3, scale * z));
  offsetX = e.clientX - wx * scale;
  offsetY = e.clientY - wy * scale;
  render();
}, {passive:false});

// ============ CONTROLS ============
function fitToScreen() {
  const pad=60, dw=systemBoundary.w+400, dh=systemBoundary.h+200;
  scale = Math.min((W-pad*2)/dw, (H-pad*2)/dh);
  offsetX = (W - dw*scale)/2 - (systemBoundary.x-180)*scale;
  offsetY = (H - dh*scale)/2 - (systemBoundary.y-40)*scale;
  render();
}
function resetView() { scale=0.55; offsetX=0; offsetY=0; render(); }
function zoomIn() { scale=Math.min(3,scale*1.2); render(); }
function zoomOut() { scale=Math.max(0.15,scale/1.2); render(); }

function exportPNG() {
  const pad = 80;
  const expScale = 2;
  // Compute full bounding box including actors
  const minX = Math.min(systemBoundary.x, ...actors.map(a=>a.x-30)) - pad;
  const minY = Math.min(systemBoundary.y, ...actors.map(a=>a.y-50)) - pad;
  const maxX = Math.max(systemBoundary.x+systemBoundary.w, ...actors.map(a=>a.x+30)) + pad;
  const maxY = Math.max(systemBoundary.y+systemBoundary.h, ...actors.map(a=>a.y+70)) + pad;
  const cw = (maxX-minX)*expScale, ch = (maxY-minY)*expScale;

  const offCanvas = document.createElement('canvas');
  offCanvas.width = cw; offCanvas.height = ch;
  const origCtx = ctx;
  const offCtx = offCanvas.getContext('2d');

  // Temporarily swap context and state
  const origUml = umlMode, origHovA = hoveredActor, origHovU = hoveredUC;
  umlMode = true; hoveredActor = null; hoveredUC = null;

  // Redirect global ctx
  window._origCtx = ctx;
  ctx = offCtx;
  const origW = W, origH = H, origDpr = dpr;
  W = cw; H = ch; dpr = 1;

  // Render with white bg
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,cw,ch);
  ctx.save();
  ctx.scale(expScale, expScale);
  ctx.translate(-minX, -minY);
  scale = 1; offsetX = 0; offsetY = 0;

  // Re-render all elements directly
  const sb = systemBoundary, br = 12;
  ctx.beginPath();
  ctx.moveTo(sb.x+br,sb.y); ctx.lineTo(sb.x+sb.w-br,sb.y);
  ctx.quadraticCurveTo(sb.x+sb.w,sb.y,sb.x+sb.w,sb.y+br);
  ctx.lineTo(sb.x+sb.w,sb.y+sb.h-br);
  ctx.quadraticCurveTo(sb.x+sb.w,sb.y+sb.h,sb.x+sb.w-br,sb.y+sb.h);
  ctx.lineTo(sb.x+br,sb.y+sb.h);
  ctx.quadraticCurveTo(sb.x,sb.y+sb.h,sb.x,sb.y+sb.h-br);
  ctx.lineTo(sb.x,sb.y+br);
  ctx.quadraticCurveTo(sb.x,sb.y,sb.x+br,sb.y);
  ctx.closePath();
  ctx.fillStyle = '#fafafa'; ctx.fill();
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = '700 16px Inter,sans-serif'; ctx.fillStyle = '#1a1a1a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(sb.label, sb.x+sb.w/2, sb.y+6);

  packages.forEach(drawPkg);
  associations.forEach(({actor,uc})=>{ const a=actorMap[actor],u=ucMap[uc]; if(a&&u) drawAssocLine(a.x,a.y,u,true,actor); });
  relationships.forEach(({from,to,type})=>{ const f=ucMap[from],t=ucMap[to]; if(f&&t) drawRelLine(f,t,type,true); });
  inheritance.forEach(({child,parent})=>drawInheritance(actorMap[child],actorMap[parent]));
  useCases.forEach(uc=>drawUCEllipse(uc,true));
  actors.forEach(a=>drawStick(a.x,a.y,a.label,true));

  ctx.restore();

  // Download
  const link = document.createElement('a');
  link.download = 'helprest-use-case-diagram.png';
  link.href = offCanvas.toDataURL('image/png');
  link.click();

  // Restore original state
  ctx = window._origCtx;
  umlMode = origUml; hoveredActor = origHovA; hoveredUC = origHovU;
  W = origW; H = origH; dpr = origDpr;
  render();
}

// ============ INIT ============
resize();
fitToScreen();
</script>
</body>
</html>
